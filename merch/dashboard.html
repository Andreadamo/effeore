<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Merch Dashboard · Effestudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#ececea; --fg:#141414; --muted:#5f5f5c; --line:#dcdcd8; --grid:#ececea;
  --accent:#141414; --accent-fg:#ffffff; --bar:#3a3a38; --ok:#1f7a45; --warn:#a86200; --crit:#b3261e;
  --ok-soft:#dcf0e3; --warn-soft:#fbecd5; --crit-soft:#f8dcd9;
  --display:"Montserrat","Arial",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --r:8px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e0e0e; --surface:#191919; --surface-2:#232323; --fg:#f2f2f0; --muted:#a3a3a0; --line:#2e2e2e; --grid:#262626;
  --accent:#f2f2f0; --accent-fg:#141414; --bar:#d6d6d2; --ok:#5cc489; --warn:#f0a845; --crit:#f07a70;
  --ok-soft:#15301f; --warn-soft:#3a2c14; --crit-soft:#3d1d1a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 15px/1.4 var(--body)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0}
h1{font-size:22px;font-weight:800;text-transform:uppercase}
h2{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;border-radius:10px}
.brand small{display:block;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;font-weight:600}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font:800 26px/1.15 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
.muted{color:var(--muted)}
.msg{padding:12px;border-radius:var(--r);font-weight:600;background:var(--crit-soft);color:var(--crit)}
.login{max-width:360px;margin:40px auto}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:13px;white-space:nowrap;transform:translate(-50%,-110%)}
.bar{fill:var(--bar)}
a{color:inherit;text-decoration:none}
.empty-ch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}.bar:hover,.bar.on{fill:var(--fg)}
</style>
</head>
<body>
<div class="wrap login" id="v-login">
  <div class="brand"><img src="icons/icon-192.png" alt=""><div><h1>Merch Dashboard</h1><small>Controllo vendite e magazzino</small></div></div>
  <div class="card">
    <label class="muted">PIN staff<input id="l-pin" type="password" inputmode="numeric" style="width:100%;margin-top:5px"></label>
    <button class="primary" id="b-login">Entra</button>
    <div id="l-err" class="msg" hidden></div>
  </div>
</div>

<div class="wrap" id="v-app" hidden>
  <div class="top">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><h1>Merch Dashboard</h1><small id="gen"></small></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div class="seg" id="per"></div>
      <button id="b-ref">Aggiorna</button>
      <a href="staff.html"><button>App staff</button></a>
    </div>
  </div>
  <div id="err" class="msg" hidden></div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <div class="card-h"><h2>Incassi merch per settimana</h2><span class="muted" id="ch-sub"></span></div>
    <div class="chart" id="chart"></div>
  </div>

  <div class="grid2">
    <div class="card"><h2>Per metodo di pagamento</h2><div class="scroll" id="t-met"></div></div>
    <div class="card"><h2>Più venduti</h2><div class="scroll" id="t-top"></div></div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Prenotazioni da ritirare</h2><span class="muted" id="ap-sub"></span></div>
    <div class="scroll" id="t-ap"></div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Magazzino per taglia</h2>
      <div style="display:flex;gap:8px;align-items:center"><select id="f-st"><option value="">Tutti</option><option value="crit">Esauriti</option><option value="warn">Sotto scorta (≤2)</option></select></div></div>
    <div class="scroll" id="t-inv"></div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Movimenti</h2><span class="muted">Vendite, annullate e scadute nel periodo</span></div>
    <div class="scroll" id="t-mov"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
const $=id=>document.getElementById(id);
const S={pin:"",d:null,per:"30"};
const PER=[["7","7 gg"],["30","30 gg"],["90","90 gg"],["all","Tutto"]];
const dt=s=>s?new Date(s).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"2-digit"}):"";
const n0=v=>(Number(v)||0).toLocaleString("it-IT");
function err(m){$("err").textContent=m;$("err").hidden=!m}

async function login(pin,silent){
  try{S.d=await run("api_dashboard",pin);S.pin=pin;store("mm-pin",pin);$("v-login").hidden=true;$("v-app").hidden=false;render()}
  catch(e){$("v-login").hidden=false;if(!silent){$("l-err").textContent=e.message;$("l-err").hidden=false}}
}
$("b-login").onclick=()=>login($("l-pin").value.trim());
$("l-pin").onkeydown=e=>{if(e.key==="Enter")$("b-login").click()};
$("b-ref").onclick=async()=>{try{S.d=await run("api_dashboard",S.pin);err("");render()}catch(e){err(e.message)}};
$("f-st").onchange=renderInv;

function renderPer(){$("per").innerHTML=PER.map(([k,l])=>`<button aria-pressed="${k===S.per}" data-k="${k}">${l}</button>`).join("");
  $("per").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.per=b.dataset.k;render()})}
const since=()=>S.per==="all"?0:Date.now()-Number(S.per)*864e5;
const inPer=s=>s&&new Date(s).getTime()>=since();

function render(){
  renderPer();
  const d=S.d;$("gen").textContent="Dati aggiornati "+new Date(d.generato).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const P=d.prenotazioni, I=d.inventario;
  const V=P.filter(p=>p.stato==="VENDUTO"&&inPer(p.chiusura));
  const incasso=V.reduce((a,p)=>a+p.totale,0), pezzi=V.reduce((a,p)=>a+p.qta,0);
  const margine=incasso*(1-1/(d.ricarico||2.5));
  const aperte=P.filter(p=>p.stato==="RISERVATO");
  const online=P.filter(p=>p.canale==="Online"&&p.stato!=="RISERVATO"&&inPer(p.chiusura));
  const ritiro=online.length?Math.round(online.filter(p=>p.stato==="VENDUTO").length/online.length*100):null;
  const stockPz=I.reduce((a,r)=>a+r.stock,0), stockVal=I.reduce((a,r)=>a+r.stock*r.prezzo,0);
  const esauriti=I.filter(r=>r.attivo&&r.disp<1).length;
  const banco=V.filter(p=>p.canale==="Banco").reduce((a,p)=>a+p.totale,0);
  $("kpis").innerHTML=[
    ["Incassato",eur(incasso),`${n0(pezzi)} pezzi · banco ${eur(banco)}`],
    ["Margine lordo stimato",eur(margine),`ricarico ${String(d.ricarico).replace(".",",")} sul costo`],
    ["Da ritirare",n0(aperte.length),eur(aperte.reduce((a,p)=>a+p.totale,0))+" in attesa"],
    ["Ritiro prenotazioni",ritiro==null?"–":ritiro+"%",`${online.length} prenotazioni chiuse nel periodo`],
    ["Magazzino",n0(stockPz)+" pz",eur(stockVal)+" a listino"],
    ["Taglie esaurite",n0(esauriti),`su ${I.filter(r=>r.attivo).length} attive`]
  ].map(([l,v,s])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
  renderChart(P);renderMet(V);renderTop(V);renderAperte(aperte);renderInv();renderMov(P);
}

function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function renderChart(P){
  const V=P.filter(p=>p.stato==="VENDUTO"&&p.chiusura);
  const nW=S.per==="7"?4:S.per==="30"?8:S.per==="90"?13:Math.max(8,Math.ceil((Date.now()-Math.min(...V.map(p=>new Date(p.chiusura).getTime()),Date.now()))/6048e5)+1);
  const cur=weekStart(Date.now()),W=[];for(let i=nW-1;i>=0;i--)W.push({t:cur-i*6048e5,v:0,n:0});
  V.forEach(p=>{const w=W.find(x=>x.t===weekStart(p.chiusura));if(w){w.v+=p.totale;w.n+=p.qta}});
  const max=Math.max(...W.map(w=>w.v),10),nice=Math.ceil(max/50)*50||50;
  const w=760,h=220,pl=48,pb=26,pt=10,cw=(w-pl-8)/W.length,bw=Math.min(36,cw*0.6);
  const y=v=>pt+(h-pt-pb)*(1-v/nice);
  let g="";for(let i=0;i<=4;i++){const v=nice*i/4;g+=`<line x1="${pl}" x2="${w-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toLocaleString("it-IT")} €</text>`}
  const bars=W.map((b,i)=>{const x=pl+i*cw+(cw-bw)/2,top=y(b.v),hh=Math.max(0,h-pb-top);
    const lab=new Date(b.t).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"});
    const r=Math.min(4,hh/2,bw/2);
    const path=hh>0?`M${x},${h-pb}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${h-pb}Z`:"";
    return `<g data-i="${i}"><rect x="${pl+i*cw}" y="${pt}" width="${cw}" height="${h-pt-pb}" fill="transparent"/>${path?`<path class="bar" d="${path}"/>`:""}
      ${(W.length<=13||i%2===0)?`<text x="${x+bw/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab}</text>`:""}</g>`}).join("");
  $("chart").innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Incassi merch per settimana"><line x1="${pl}" x2="${w-8}" y1="${h-pb}" y2="${h-pb}" stroke="var(--line)"/>${g}${bars}</svg><div class="tip" hidden></div>${W.some(b=>b.v>0)?"":`<div class="empty-ch">Nessuna vendita nel periodo</div>`}`;
  $("ch-sub").textContent="Settimane da lunedì · totale "+eur(W.reduce((a,b)=>a+b.v,0));
  const svg=$("chart").querySelector("svg"),tip=$("chart").querySelector(".tip");
  svg.querySelectorAll("g[data-i]").forEach(gg=>{
    gg.onmouseenter=gg.ontouchstart=()=>{const b=W[gg.dataset.i];const r=svg.getBoundingClientRect(),k=r.width/w;
      tip.innerHTML=`Settimana dal ${new Date(b.t).toLocaleDateString("it-IT",{day:"2-digit",month:"short"})}<br><b>${eur(b.v)}</b> · ${b.n} pz`;
      tip.style.left=((pl+gg.dataset.i*cw+cw/2)*k)+"px";tip.style.top=(y(b.v)*k)+"px";tip.hidden=false;
      const p=gg.querySelector(".bar");if(p)p.classList.add("on")};
    gg.onmouseleave=()=>{tip.hidden=true;const p=gg.querySelector(".bar");if(p)p.classList.remove("on")};
  });
}
function table(head,rows,num){return `<table><thead><tr>${head.map((h,i)=>`<th class="${num.includes(i)?"n":""}">${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${num.includes(i)?"n":""}">${c}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${head.length}" class="muted">Nessun dato nel periodo.</td></tr>`}</tbody></table>`}
function renderMet(V){
  const m={};V.forEach(p=>{const k=p.metodo||"Non indicato";(m[k]=m[k]||{n:0,v:0});m[k].n+=p.qta;m[k].v+=p.totale});
  const tot=V.reduce((a,p)=>a+p.totale,0)||1;
  $("t-met").innerHTML=table(["Metodo","Pezzi","Incasso","Quota"],Object.entries(m).sort((a,b)=>b[1].v-a[1].v).map(([k,x])=>[esc(k),x.n,eur(x.v),Math.round(x.v/tot*100)+"%"]),[1,2,3]);
}
function renderTop(V){
  const m={};V.forEach(p=>{const k=p.prodotto;(m[k]=m[k]||{n:0,v:0});m[k].n+=p.qta;m[k].v+=p.totale});
  $("t-top").innerHTML=table(["Capo","Pezzi","Incasso"],Object.entries(m).sort((a,b)=>b[1].n-a[1].n).slice(0,8).map(([k,x])=>[esc(k),x.n,eur(x.v)]),[1,2]);
}
function renderAperte(A){
  const g=S.d.scadenzaGg||7;
  $("ap-sub").textContent=A.length+" aperte · scadenza "+g+" giorni dalla prenotazione";
  $("t-ap").innerHTML=table(["Codice","Cliente","Capo","Tg","Totale","Prenotata","Scade"],A.sort((a,b)=>a.data.localeCompare(b.data)).map(p=>{
    const left=Math.ceil((new Date(p.data).getTime()+g*864e5-Date.now())/864e5);
    const pl=left<=1?`<span class="pill crit">⚠ ${left<=0?"oggi":"domani"}</span>`:left<=3?`<span class="pill warn">${left} gg</span>`:`${left} gg`;
    return [esc(p.codice),esc(p.nome),esc(p.prodotto),esc(p.taglia),eur(p.totale),dt(p.data),pl]}),[4]);
}
function renderInv(){
  const f=$("f-st").value;
  const rows=S.d.inventario.filter(r=>r.attivo).filter(r=>!f||(f==="crit"?r.disp<1:r.disp>0&&r.disp<=2))
    .sort((a,b)=>a.prodotto.localeCompare(b.prodotto)||a.id.localeCompare(b.id));
  $("t-inv").innerHTML=table(["Capo","Tg","Prezzo","Stock","Prenotati","Venduti","Liberi","Stato"],rows.map(r=>{
    const st=r.disp<1?'<span class="pill crit">✕ esaurito</span>':r.disp<=2?'<span class="pill warn">! ultimi</span>':'<span class="pill ok">✓ ok</span>';
    return [esc(r.prodotto),esc(r.taglia),eur(r.promo>0&&r.promo<r.prezzo?r.promo:r.prezzo),r.stock,r.riservati,r.venduti,r.disp,st]}),[2,3,4,5,6]);
}
function renderMov(P){
  const M=P.filter(p=>p.stato!=="RISERVATO"&&inPer(p.chiusura)).sort((a,b)=>b.chiusura.localeCompare(a.chiusura)).slice(0,100);
  $("t-mov").innerHTML=table(["Data","Codice","Cliente","Capo","Tg","Totale","Esito","Metodo","Canale","Operatore"],M.map(p=>{
    const cls=p.stato==="VENDUTO"?"ok":"crit";
    return [dt(p.chiusura),esc(p.codice),esc(p.nome),esc(p.prodotto),esc(p.taglia),eur(p.totale),`<span class="pill ${cls}">${esc(p.stato)}</span>`,esc(p.metodo||"–"),p.canale,esc(p.operatore)]}),[5]);
}

const sp=load("mm-pin");
if(sp){$("v-login").hidden=true;login(sp,true)}
</script>
</body>
</html>
