<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merch Effestudio</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Barlow&#43;Condensed:wght@600;800&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--soft:#F3F3F1;--ink:#000000;--muted:#5E5E5E;--line:#DADAD6;--err:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
.top img{height:44px;width:auto}
.top a{color:var(--ink);font-weight:600;font-size:14px;text-decoration:none}
.hero{position:relative;min-height:360px;display:flex;align-items:flex-end;background:#111 url('https://irp.cdn-website.com/43c02c7b/dms3rep/multi/opt/Stampafitness+%2898+di+245%29-1989w.jpg') center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.75))}
.hero .wrap{position:relative;color:#fff;padding-bottom:28px}
.hero small{font-size:15px;opacity:.9}
.hero h1{font:800 clamp(40px,9vw,72px)/.92 "Barlow Condensed",Impact,sans-serif;margin:6px 0 10px}
.hero p{margin:0;max-width:46ch;opacity:.92}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.hero .wrap{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap}
.hero .logo{color:#fff;height:170px;width:auto;flex:none}
@media(max-width:560px){.hero .logo{height:120px}}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;overflow-x:auto;padding:3px 0}
.chip{border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:7px 16px;border-radius:999px;font:600 15px Barlow,sans-serif;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.demo{background:var(--soft);padding:10px 14px;font-size:14px;margin-top:14px;border-left:4px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:22px;padding:22px 0 70px}
.card{display:flex;flex-direction:column;border:1px solid var(--line)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 35%;background:var(--soft)}
.ph{aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;font:800 34px/.9 "Barlow Condensed",sans-serif}
.ph span{font:500 13px Barlow,sans-serif;opacity:.85;margin-top:6px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h2{font:800 27px/1 "Barlow Condensed",sans-serif;margin:0}
.meta{color:var(--muted);font-size:14px}
.color{display:flex;align-items:center;gap:8px;font-size:14px}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.price{font:600 22px "Barlow Condensed",sans-serif}
.old{color:var(--muted);font-weight:500;margin-right:4px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.size{min-width:48px;padding:8px 10px;border:1.5px solid var(--line);background:#fff;font:600 15px Barlow,sans-serif;cursor:pointer}
.size[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.size:disabled{color:#A9A9A9;text-decoration:line-through;cursor:not-allowed;background:var(--soft)}
.hint{font-size:13px;color:var(--err);min-height:18px}
.btn{margin-top:auto;border:0;background:var(--ink);color:#fff;padding:13px;font:800 19px "Barlow Condensed",sans-serif;cursor:pointer}
.btn:disabled{background:#CFCFCB;color:#6F6F6F;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #2F6FDE;outline-offset:2px}
.empty,.loading{padding:40px 0;color:var(--muted)}
footer{background:var(--ink);color:#fff;padding:26px 0;font-size:14px}
footer a{color:#fff}
dialog{border:0;padding:0;width:min(440px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:22px}
.dlg h3{font:800 30px/1 "Barlow Condensed",sans-serif;margin:0 0 4px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select{width:100%;padding:11px;border:1.5px solid var(--line);font:16px Barlow,sans-serif}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13px;color:var(--muted)}
.check input{width:auto;margin-top:3px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1;margin:0}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.code{font:800 42px "Barlow Condensed",sans-serif;background:var(--soft);padding:10px;text-align:center;margin:12px 0;letter-spacing:1px}
.err{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<section class="hero"><div class="wrap">

.64 L 569.32 521.76 C 569.32 533.51 560.64 544.02 547.61 544.02 C 534.57 544.02 526.03 533.63 526.03 521.89 "/></svg>
  <div><small>la persona al centro del proprio benessere</small>
  <h1>Merch Effe Studio</h1>
  <p>Scegli capo e taglia, prenota. Paghi e ritiri in palestra.</p></div>
</div></section>

<div class="filters"><div class="wrap">
  <div class="row" id="fCat"></div>
  <div class="row" id="fLinea"></div>
</div></div>

<main class="wrap"><div class="grid" id="grid"><div class="loading">Caricamento catalogo…</div></div></main>

<footer><div class="wrap">
  Effe Studio Training Center, Cecina. <a href="tel:&#43;393338068331">+39 333 806 8331</a>, <a href="mailto:effestudiotrainingcenter@gmail.com">effestudiotrainingcenter@gmail.com</a>
  <a href="https://www.effestudio.info/">effestudio.info</a>
</div></footer>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
 
const COLORI={'nero':'#111111','bianco':'#F5F5F2','marrone caffè':'#4B3326','marrone':'#6B4A36'};

let items=[],fCat='Tutti',fLinea='Tutti',sel={};
const $=s=>document.querySelector(s);
const eurP=n=>n>0?eur(n):'Prezzo in palestra';
const prezzo=t=>t.promo>0&&t.promo<t.prezzo?`<s class="old">${eurP(t.prezzo)}</s> ${eurP(t.promo)}`:eurP(t.prezzo);
const ORD=['XS','XS/S','S','M','M/L','L','XL','XXL','Unica'];
const colore=p=>{const k=Object.keys(COLORI).find(c=>p.toLowerCase().endsWith(c));return k?{nome:k.replace(/^./,x=>x.toUpperCase()),hex:COLORI[k]}:null};

function chips(el,vals,cur,cb){
  el.innerHTML=vals.map(v=>`<button class="chip" aria-pressed="${v===cur}" data-v="${esc(v)}">${esc(v)}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>cb(b.dataset.v));
}
function renderFilters(){
  const cats=['Tutti',...new Set(items.map(i=>i.categoria))];
  const lin=['Tutti',...new Set(items.map(i=>i.linea))];
  chips($('#fCat'),cats,fCat,v=>{fCat=v;render()});
  $('#fLinea').style.display=lin.length>2?'flex':'none';
  chips($('#fLinea'),lin,fLinea,v=>{fLinea=v;render()});
}
function groups(){
  const g={};
  items.filter(i=>(fCat==='Tutti'||i.categoria===fCat)&&(fLinea==='Tutti'||i.linea===fLinea))
    .forEach(i=>{const k=i.prodotto+'|'+i.linea+'|'+i.genere;(g[k]=g[k]||{...i,taglie:[]}).taglie.push(i)});
  return Object.entries(g).map(([k,v])=>{v.key=k;v.taglie.sort((a,b)=>ORD.indexOf(a.taglia)-ORD.indexOf(b.taglia));return v}).sort((a,b)=>!fotoDi(a)-!fotoDi(b));
}
function render(){
  renderFilters();
  const gs=groups();
  if(!gs.length){$('#grid').innerHTML='<div class="empty">Nessun articolo in questa categoria. Scegli "Tutti".</div>';return}
  $('#grid').innerHTML=gs.map((g,gi)=>{
    const s=sel[g.key],tot=g.taglie.reduce((a,t)=>a+t.disp,0),c=colore(g.prodotto);
    const nome=c?g.prodotto.slice(0,-c.nome.length).trim():g.prodotto;
    const f=fotoDi(g);
    const img=f?`<img src="${esc(f)}" alt="${esc(g.prodotto)}" loading="lazy">`
      :`<div class="ph" style="background:${c&&c.nome!=='Bianco'?c.hex:'#1c1c1c'}">${esc(nome)}<span>Foto in arrivo</span></div>`;
    return `<article class="card">${img}<div class="body">
      <h2>${esc(nome)}</h2>
      <div class="meta">${esc(g.categoria)} ${esc(g.genere.toLowerCase())}</div>
      ${c?`<div class="color"><span class="sw" style="background:${c.hex}"></span>${esc(c.nome)}</div>`:''}
      <div class="price">${prezzo(s||g)}</div>
      <div class="sizes">${g.taglie.map(t=>`<button class="size" data-g="${gi}" data-id="${esc(t.id)}" aria-pressed="${!!(s&&s.id===t.id)}" ${t.disp<1?'disabled':''}>${esc(t.taglia)}</button>`).join('')}</div>
      <div class="hint">${s&&s.disp<=2?'Ultimi '+s.disp+' pezzi':''}</div>
      <button class="btn" data-g="${gi}" ${!s||tot<1?'disabled':''}>${tot<1?'Esaurito':s?'Prenota taglia '+esc(s.taglia):'Scegli la taglia'}</button>
    </div></article>`}).join('');
  $('#grid').querySelectorAll('.size').forEach(b=>b.onclick=()=>{const g=gs[b.dataset.g];sel[g.key]=g.taglie.find(t=>t.id===b.dataset.id);render()});
  $('#grid').querySelectorAll('.btn').forEach(b=>b.onclick=()=>openForm(sel[gs[b.dataset.g].key]));
}
function success(r){
  $('#dlgBody').innerHTML=`<h3>Prenotato</h3><div class="meta">${esc(r.prodotto)}, taglia ${esc(r.taglia)}, x${r.qta}${r.totale?'. Totale '+eurP(r.totale):''}.</div>
    <div class="code">${esc(r.codice)}</div>
    <div class="meta">Mostra questo codice in reception. Paga e ritira entro ${r.giorni} giorni, poi la prenotazione scade.</div>
    <div class="actions"><button class="btn" id="ok">Chiudi</button></div>`;
  $('#ok').onclick=()=>{$('#dlg').close();loadCat()};
}
function openForm(t){
  const max=Math.min(t.disp,5);
  $('#dlgBody').innerHTML=`<h3>${esc(t.prodotto)}</h3>
    <div class="meta">Taglia ${esc(t.taglia)}. ${prezzo(t)}</div>
    <label for="q">Quantità</label><select id="q">${Array.from({length:max},(_,i)=>`<option>${i+1}</option>`).join('')}</select>
    <label for="n">Nome e cognome</label><input id="n" autocomplete="name">
    <label for="t">Telefono</label><input id="t" type="tel" autocomplete="tel">
    <label for="e">Email (facoltativa)</label><input id="e" type="email" autocomplete="email">
    <label class="check"><input type="checkbox" id="p"> Acconsento al trattamento dei dati per gestire la prenotazione.</label>
    <div class="err" id="err"></div>
    <div class="actions"><button class="btn ghost" id="x">Annulla</button><button class="btn" id="go">Prenota</button></div>`;
  $('#x').onclick=()=>$('#dlg').close();
  $('#go').onclick=()=>{
    const b=$('#go'),p={id:t.id,qta:$('#q').value,nome:$('#n').value,tel:$('#t').value,email:$('#e').value,privacy:$('#p').checked};
    b.disabled=true;b.textContent='Prenotazione…';$('#err').textContent='';
    run('api_riserva',p).then(success).catch(e=>{$('#err').textContent=e.message;b.disabled=false;b.textContent='Prenota'});
  };
  $('#dlg').showModal();
}
function setData(d){items=d;Object.keys(sel).forEach(k=>{const n=items.find(i=>sel[k]&&i.id===sel[k].id);sel[k]=n&&n.disp>0?n:undefined});render()}
function loadCat(){
  run('api_catalogo').then(setData).catch(e=>{$('#grid').innerHTML='<div class="empty">Catalogo non raggiungibile: '+esc(e.message)+'</div>'});
}
loadCat();
</script>
</body>
</html>
